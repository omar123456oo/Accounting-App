<main class="login">
  <section class="login-form-pane">
    <div class="login-card">
      <div class="login-top">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect width="32" height="32" rx="8" fill="#0d2b33" />
            <path d="M7 12h18M16 12v10M10 22h12" stroke="#c9a24b" stroke-width="2.4" stroke-linecap="round" fill="none" />
          </svg>
          <span class="brand-name">{{ 'app.name' | translate }}</span>
        </div>
        <app-language-switch />
      </div>
      <ng-content />
    </div>
  </section>
  <aside class="login-art-pane"><app-login-art /></aside>
</main>
