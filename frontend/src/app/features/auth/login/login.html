<app-auth-layout>
  <div class="auth-form">
    <h1 class="auth-title">{{ 'login.title' | translate }}</h1>
    <p class="auth-welcome">{{ 'login.welcome' | translate }}</p>

    @if (locked()) {
      <div class="alert alert-danger" role="alert" id="lockout-message">
        {{ 'errors.locked' | translate }}
      </div>
    }

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
      [attr.aria-label]="'login.title' | translate"
      [attr.aria-busy]="submitting()"
    >
      <div class="mb-3">
        <label for="email" class="form-label">{{ 'login.email' | translate }}</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="username"
          autofocus
          required
          [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
          aria-describedby="email-error"
        />
        <app-field-error [control]="form.controls.email" id="email-error" />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">{{ 'login.password' | translate }}</label>
        <div class="password-wrap">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            required
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
            [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-pressed]="showPassword()"
            [attr.aria-label]="
              (showPassword() ? 'login.hidePassword' : 'login.showPassword') | translate
            "
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
              @if (showPassword()) {
                <path d="M4 20 20 4" />
              }
            </svg>
          </button>
        </div>
        <app-field-error [control]="form.controls.password" id="password-error" />
      </div>

      @if (otpRequired()) {
        <div class="mb-3">
          <label for="otp" class="form-label">{{ 'login.otp' | translate }}</label>
          <input
            #otpInput
            id="otp"
            type="text"
            inputmode="numeric"
            class="form-control"
            formControlName="otp"
            autocomplete="one-time-code"
            maxlength="6"
            required
            [class.is-invalid]="form.controls.otp.invalid && form.controls.otp.touched"
            [attr.aria-invalid]="form.controls.otp.invalid && form.controls.otp.touched"
            aria-describedby="otp-error otp-hint"
          />
          <div id="otp-hint" class="form-text">{{ 'login.otpHint' | translate }}</div>
          <app-field-error [control]="form.controls.otp" id="otp-error" />
        </div>
      }

      <button type="submit" class="btn btn-submit w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        {{ 'login.submit' | translate }}
      </button>
    </form>

    <p class="auth-switch">
      {{ 'login.newHere' | translate }}
      <a routerLink="/register">{{ 'login.register' | translate }}</a>
    </p>
  </div>
</app-auth-layout>
