# Local development stack. Dev passwords are placeholders; never reuse them outside a developer machine.
x-php: &php
  build: ./docker/php
  image: accounting-php
  volumes: [ "./backend:/var/www/backend" ]
  env_file: ./backend/.env
  depends_on:
    db: { condition: service_healthy }

services:
  app:
    <<: *php
  web:
    image: nginx:1.27
    ports: [ "8080:80" ]
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [ app ]
  queue:
    <<: *php
    command: php artisan queue:work --tries=3
  scheduler:
    <<: *php
    command: php artisan schedule:work
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres_dev_only }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports: [ "5432:5432" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  mongo:
    # Single-node replica set: the audit chain uses transactions. No auth in dev (a replica set with auth needs a keyFile); never expose this port beyond localhost.
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: [ "127.0.0.1:27017:27017" ]
    volumes: [ "mongodata:/data/db" ]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio_dev, MINIO_ROOT_PASSWORD: minio_dev_only }
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "miniodata:/data" ]
  mailpit:
    image: axllent/mailpit
    ports: [ "8025:8025", "1025:1025" ]
volumes: { pgdata: {}, miniodata: {}, mongodata: {} }
